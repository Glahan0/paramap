[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paramap"
version = "0.2.0"
description = "Budgeted, lossless VRAM/RAM residency for local LLMs"
authors = [{ name = "ParamMap Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "safetensors>=0.4.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
    # Required by paramap.arch.gguf_adapter, which paramap/__init__.py pulls in
    # transitively -- without it `import paramap` fails outright.
    # Floor is the version this project is tested against (gguf-py publishes
    # irregularly to PyPI; relax only after verifying quants.dequantize exists).
    "gguf>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
paramap = "paramap.cli:main"
