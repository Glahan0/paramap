[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paramap"
version = "0.2.0"
description = "Run local LLMs under a VRAM budget: exact layer streaming or faster CPU offload"
authors = [{ name = "ParamMap Team" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "accelerate>=0.28.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
# Only the archived approach (paramap.legacy.gguf_adapter / legacy.engine)
# reads GGUF files; the live residency engine does not import gguf.
# Floor is the version this project is tested against (gguf-py publishes
# irregularly to PyPI; relax only after verifying quants.dequantize exists).
legacy = [
    "gguf>=0.19.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
paramap = "paramap.cli:main"
